<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e9a6b9">
<title>Happy Birthday Ms. Kayla</title>
<style>
:root{--pink:#e9a6b9;--rose:#c25e82;--darkrose:#a94c71;--cream:#fffdf9}
*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden;background:#dfa0b6}body{font-family:Georgia,'Times New Roman',serif}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;overflow:hidden;transform-origin:center center;background:linear-gradient(180deg,#e7a5bc 0%,#f2a6ae 54%,#fac5a7 89%,#f7d8c2 100%);box-shadow:0 0 80px #8e5d7230;isolation:isolate}
#stage:before{content:"";position:absolute;inset:-10%;background:radial-gradient(ellipse at 18% 32%,#ffffff43,transparent 26%),radial-gradient(ellipse at 83% 42%,#ffffff3b,transparent 30%);pointer-events:none}
.bunting{position:absolute;top:-3px;width:660px;height:225px;z-index:2;pointer-events:none}.bunting.left{left:-70px}.bunting.right{right:-70px;transform:scaleX(-1)}.bunting path.line{fill:none;stroke:#fff9ef;stroke-width:3.4}.bunting polygon:nth-of-type(3n+1){fill:#e77a9e}.bunting polygon:nth-of-type(3n+2){fill:#f9dbd5}.bunting polygon:nth-of-type(3n){fill:#da7b9d}
.star{position:absolute;z-index:4;width:9px;height:9px;background:white;border-radius:50%;box-shadow:0 0 15px 6px #fff9,0 0 30px 14px #fff5;animation:twinkle 3.5s ease-in-out infinite;pointer-events:none}.star:before,.star:after{content:"";position:absolute;top:50%;left:50%;background:#fff;transform:translate(-50%,-50%)}.star:before{width:3px;height:80px;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}.star:after{width:80px;height:3px;clip-path:polygon(0 50%,50% 0,100% 50%,50% 100%)}@keyframes twinkle{50%{opacity:.35;transform:scale(.7)}}
.heading{position:absolute;top:24px;left:390px;width:1140px;text-align:center;z-index:3;color:#fffdf6;text-shadow:0 4px 9px #ba74934d}.heading .happy{font-family:'Brush Script MT','Segoe Script','URW Chancery L',cursive;font-weight:400;font-size:115px;line-height:1.05;font-style:italic;letter-spacing:5px}.heading .birthday{font-family:Impact,'Arial Narrow','Liberation Sans Narrow',Arial,sans-serif;font-stretch:condensed;font-weight:900;font-size:154px;line-height:.97;letter-spacing:12px}
.photo{position:absolute;z-index:4;background:#fffdf6;border:12px solid #fffdf6;border-bottom-width:40px;box-shadow:0 16px 25px #94456252,0 2px 4px #77375325;overflow:hidden;transform-origin:center;will-change:transform}.photo img{display:block;width:100%;height:100%;object-fit:cover}.photo.left{left:275px;top:350px;width:328px;height:405px;transform:rotate(-8deg)}.photo.left img{object-position:center 58%}.photo.center{left:753px;top:307px;width:414px;height:491px;transform:rotate(2deg);z-index:7}.photo.center img{object-position:center 63%}.photo.right{left:1317px;top:350px;width:328px;height:405px;transform:rotate(8deg)}.photo.right img{object-position:center 57%}
.photo.side-slide{width:288px;height:277px;top:482px;border-width:10px;border-bottom-width:35px;z-index:3}.photo.side-slide.left-slide{left:52px;transform:rotate(-12deg)}.photo.side-slide.right-slide{right:52px;transform:rotate(12deg)}.side-slide img{position:absolute;inset:0;object-fit:cover;object-position:center 45%;transition:opacity 1.3s ease}.side-slide img.out{opacity:0}
.ribbon{position:absolute;left:685px;top:770px;width:550px;height:93px;z-index:10;display:flex;align-items:center;justify-content:center;background:#fa9fb2;border:4px solid #fff0e7;box-shadow:0 7px 13px #a9576a30;clip-path:polygon(0 8%,10% 20%,10% 0,90% 0,90% 20%,100% 8%,95% 50%,100% 92%,90% 80%,90% 100%,10% 100%,10% 80%,0 92%,5% 50%)}.ribbon span{font-size:53px;letter-spacing:10px;color:#9b4c6a;font-weight:500;text-shadow:0 1px #fff9}
.clouds{position:absolute;left:0;right:0;bottom:-30px;height:280px;z-index:8;background:#fffdfa;filter:drop-shadow(0 -9px 11px #bb728220)}.clouds:before{content:"";position:absolute;top:-67px;left:-55px;width:calc(100% + 110px);height:145px;background:radial-gradient(ellipse 123px 94px at 6% 90%,#fffdfa 98%,transparent 100%),radial-gradient(ellipse 143px 88px at 19% 90%,#fffdfa 98%,transparent 100%),radial-gradient(ellipse 148px 94px at 34% 90%,#fffdfa 98%,transparent 100%),radial-gradient(ellipse 150px 88px at 50% 90%,#fffdfa 98%,transparent 100%),radial-gradient(ellipse 143px 94px at 66% 90%,#fffdfa 98%,transparent 100%),radial-gradient(ellipse 143px 88px at 81% 90%,#fffdfa 98%,transparent 100%),radial-gradient(ellipse 123px 94px at 95% 90%,#fffdfa 98%,transparent 100%)}
.wish{position:absolute;left:120px;right:120px;top:881px;z-index:12;color:#b35a7c;text-align:center;font-family:Georgia,'Times New Roman',serif;font-size:36px;line-height:1.4;font-weight:bold;letter-spacing:1px;text-shadow:0 1px #fff}.wish p{margin:0}
.balloon-group{position:absolute;z-index:2;bottom:250px;width:160px;height:270px;pointer-events:none;animation:float 6s ease-in-out infinite}.balloon-group.bl{left:1px}.balloon-group.br{right:1px;transform:scaleX(-1);animation-delay:-3s}.balloon{position:absolute;width:78px;height:99px;border-radius:50% 50% 47% 47%;background:radial-gradient(ellipse at 28% 22%,#fff9,transparent 24%),linear-gradient(120deg,#c87d92,#f1cdd4 46%,#a7687e);box-shadow:inset -8px -10px 13px #9a5a6a3b,0 5px 11px #944a662d}.balloon:before{content:"";position:absolute;bottom:-7px;left:34px;border-left:6px solid transparent;border-right:6px solid transparent;border-top:10px solid #d6a0ac}.balloon:after{content:"";position:absolute;left:39px;top:98px;height:108px;border-left:2px solid #fff9;transform:rotate(9deg)}.balloon:nth-child(1){left:19px;top:0}.balloon:nth-child(2){left:80px;top:70px;background:radial-gradient(ellipse at 28% 22%,#fff9,transparent 24%),linear-gradient(120deg,#c4a7ae,#fff 48%,#b2a1a5)}.balloon:nth-child(3){left:0;top:105px;background:radial-gradient(ellipse at 28% 22%,#fff9,transparent 24%),linear-gradient(120deg,#da7794,#f7c6cf 48%,#b96880)}@keyframes float{50%{translate:0 -17px}}
.controls{position:fixed;right:20px;bottom:15px;display:flex;gap:8px;z-index:50;opacity:.08;transition:opacity .3s}.controls:hover,.controls:focus-within{opacity:.95}.controls button{border:1px solid #fff8;color:#fff;background:#583d5599;backdrop-filter:blur(5px);width:42px;height:42px;border-radius:50%;font-size:20px;cursor:pointer}.controls button:focus-visible{outline:3px solid white}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main id="stage" aria-label="Thiệp Happy Birthday Ms. Kayla">
  <svg class="bunting left" viewBox="0 0 660 225" aria-hidden="true"><path class="line" d="M-20 200 Q210 202 370 -100"/><polygon points="95,171 136,171 125,224"/><polygon points="145,148 187,140 187,192"/><polygon points="197,110 239,100 248,149"/><polygon points="244,57 283,44 298,96"/><polygon points="289,1 333,-5 348,45"/><path class="line" d="M40 -35 Q230 164 540 190"/><polygon points="175,76 204,104 163,132"/><polygon points="243,119 268,144 229,160"/><polygon points="324,153 353,173 312,191"/><polygon points="400,170 429,186 393,203"/></svg>
  <svg class="bunting right" viewBox="0 0 660 225" aria-hidden="true"><path class="line" d="M-20 200 Q210 202 370 -100"/><polygon points="95,171 136,171 125,224"/><polygon points="145,148 187,140 187,192"/><polygon points="197,110 239,100 248,149"/><polygon points="244,57 283,44 298,96"/><polygon points="289,1 333,-5 348,45"/><path class="line" d="M40 -35 Q230 164 540 190"/><polygon points="175,76 204,104 163,132"/><polygon points="243,119 268,144 229,160"/><polygon points="324,153 353,173 312,191"/><polygon points="400,170 429,186 393,203"/></svg>
  <div class="star" style="left:185px;top:195px"></div><div class="star" style="right:182px;top:315px;animation-delay:-1s"></div><div class="star" style="left:103px;top:72px;animation-delay:-1.7s"></div><div class="star" style="right:97px;top:635px;animation-delay:-.7s"></div>
  <header class="heading"><div class="happy">Happy</div><div class="birthday">BIRTHDAY</div></header>
  <div class="balloon-group bl"><i class="balloon"></i><i class="balloon"></i><i class="balloon"></i></div><div class="balloon-group br"><i class="balloon"></i><i class="balloon"></i><i class="balloon"></i></div>
  <div class="photo side-slide left-slide" aria-label="Ảnh tập thể luân phiên"><img src="assets/hinh_slide_1.jpg" alt="Ảnh chúc mừng cùng tập thể" id="slideLeftA"><img src="assets/hinh_slide_2.jpg" alt="Ảnh chúc mừng cùng tập thể" id="slideLeftB" class="out"></div>
  <div class="photo left"><img src="assets/hinh_left.jpg" alt="Ms. Kayla - ảnh bên trái"></div>
  <div class="photo center"><img src="assets/hinh_center.jpg" alt="Ms. Kayla - ảnh chính"></div>
  <div class="photo right"><img src="assets/hinh_right.jpg" alt="Ms. Kayla - ảnh bên phải"></div>
  <div class="photo side-slide right-slide" aria-label="Ảnh tập thể luân phiên"><img src="assets/hinh_slide_2.jpg" alt="Ảnh chúc mừng cùng tập thể" id="slideRightA"><img src="assets/hinh_slide_1.jpg" alt="Ảnh chúc mừng cùng tập thể" id="slideRightB" class="out"></div>
  <div class="clouds" aria-hidden="true"></div>
  <div class="ribbon"><span>MS. KAYLA</span></div>
  <section class="wish"><p>Kính chúc Sếp sinh nhật vui vẻ, luôn mạnh khỏe, hạnh phúc và thành công.</p><p>Chúc Sếp tuổi mới thật nhiều năng lượng, gặt hái thêm nhiều thành tựu</p><p>và tiếp tục dẫn dắt tập thể ngày càng phát triển vững mạnh.</p></section>
</main>
<div class="controls" aria-label="Điều khiển trình chiếu"><button id="toggleMotion" aria-label="Tạm dừng slideshow" title="Tạm dừng / tiếp tục (P)">Ⅱ</button><button id="fullscreen" aria-label="Toàn màn hình" title="Toàn màn hình (F)">⛶</button></div>
<script>
(function(){'use strict';
  const stage=document.getElementById('stage');
  function resize(){const s=Math.min(innerWidth/1920,innerHeight/1080);stage.style.transform='translate(-50%,-50%) scale('+s+')';}
  addEventListener('resize',resize);resize();
  let paused=false,second=false;
  const motionButton=document.getElementById('toggleMotion');
  function swap(){if(paused||document.hidden)return;second=!second;['slideLeftB','slideRightB'].forEach(id=>document.getElementById(id).classList.toggle('out',!second));['slideLeftA','slideRightA'].forEach(id=>document.getElementById(id).classList.toggle('out',second));}
  setInterval(swap,6500);
  function toggle(){paused=!paused;stage.style.setProperty('animation-play-state',paused?'paused':'running');document.querySelectorAll('.balloon-group,.star').forEach(el=>el.style.animationPlayState=paused?'paused':'running');motionButton.textContent=paused?'▶':'Ⅱ';motionButton.setAttribute('aria-label',paused?'Tiếp tục slideshow':'Tạm dừng slideshow');}
  motionButton.addEventListener('click',toggle);
  const fullscreen=document.getElementById('fullscreen');fullscreen.addEventListener('click',()=>{if(!document.fullscreenElement){document.documentElement.requestFullscreen?.();}else{document.exitFullscreen?.();}});
  document.addEventListener('keydown',e=>{if(e.key.toLowerCase()==='f'&&!e.repeat){fullscreen.click()}if(e.key.toLowerCase()==='p'&&!e.repeat){toggle()}});
})();
</script>
</body>
</html>
